<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Binding</title>
    <script src="https://unpkg.com/vue@3"></script>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div id="appdiv">
        <h1>Guitars</h1>
        <div class="guitars">
            <!-- <div v-for="guitar in guitars" :key="guitar.id">
                <h2>{{ guitar.name }}</h2>
                <span v-if="guitar.stock === 0" 
                class="out-of-stock">Out of stock</span>

                <span v-else-if="guitar.stock < 3" 
                class="only-few-left">Last chance, only {{ guitar.stock }} left.</span>

                <span v-else class="in-stock">In stock</span>
            </div> -->

            <div v-for="guitar in guitars" :key="guitar.id">
                <h2>{{ guitar.name }}</h2>
                <span :class="{
                'out-of-stock': guitar.stock === 0, 
                'in-stock': guitar.stock > 0,
                'only-few-left': guitar.stock < 3 && guitar.stock > 0}">
                {{ guitar.stock }} in stock</span>
            </div>
        </div>
    </div>

    <script src="main.js"></script>

</body>

</html>

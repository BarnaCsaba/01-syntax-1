<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computed Price</title>
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
    <div id="appdiv">  
        <h1>Price: {{ price }}</h1>
        <button @click="increasePrice">Increase</button>
        <p>{{ price.toLocaleString('en-US', { style: 'currency', currency: 'EUR' }) }}</p>
        <button @click="decreasePrice">Decrease</button>
    </div>
    
    <script src="main.js"></script>

</body>
</html>
